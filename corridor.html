*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Helvetica Neue","PingFang SC",sans-serif;background:#0d0d0d;color:#eee;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
::selection{background:#FFD23F;color:#000}

/* ---- 顶栏 ---- */
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,13,13,.88);backdrop-filter:blur(14px);border-bottom:1px solid #222;padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
.top .brand{font-weight:900;font-size:16px;letter-spacing:.04em;color:#FFD23F;text-decoration:none;white-space:nowrap}
.top .links{display:flex;gap:4px;margin-left:auto}
.top .links a{color:#888;text-decoration:none;font-size:12px;padding:5px 10px;border-radius:4px;transition:.2s;white-space:nowrap}
.top .links a:hover{color:#fff;background:#222}
.top .links a.on{color:#FFD23F}

/* ---- 标题区 ---- */
.head{padding:96px 5vw 20px;text-align:center}
.head h1{font-size:clamp(30px,5vw,56px);font-weight:900;line-height:1.05;letter-spacing:-.02em;background:linear-gradient(115deg,#FFD23F,#FF6B6B,#74B9FF,#0ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.head p{color:#777;font-size:clamp(13px,1.6vw,16px);line-height:1.8}
.head p b{color:#aaa}

/* ---- 轮播主体:4 行,方向交替,速度不同 ---- */
.belt{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;padding:16px 0 32px;overflow:hidden}
.row{display:flex;overflow:hidden;user-select:none;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);opacity:0;--row-from:0%;animation:corridorRowIn .9s cubic-bezier(.22,.75,.25,1) both;animation-delay:var(--row-delay,0ms)}
.row .track{display:flex;gap:14px;padding-right:14px;flex-shrink:0;min-width:100%;animation:slide var(--track-duration,40s) linear infinite}
.row.rev .track{animation-direction:reverse}
.row:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-100%)}}
@keyframes corridorRowIn{from{opacity:0;transform:translateX(var(--row-from))}to{opacity:1;transform:translateX(0)}}

/* ---- 卡片(走廊里的门牌) ---- */
.card{flex-shrink:0;width:230px;padding:16px 18px 14px;border-radius:8px;text-decoration:none;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.22,.75,.25,1),box-shadow .35s,filter .35s;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.card:hover{transform:translateY(-8px) scale(1.08) rotate(var(--card-tilt,2deg));box-shadow:0 0 26px var(--card-accent,rgba(255,255,255,.6)),0 0 56px rgba(255,255,255,.16);filter:saturate(1.16);z-index:2}
.card .card-particle{position:absolute;left:50%;top:50%;width:var(--particle-size,3px);height:var(--particle-size,3px);border-radius:var(--particle-radius,50%);background:var(--particle-color,currentColor);box-shadow:0 0 8px var(--particle-color,currentColor);opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(0deg);pointer-events:none;z-index:5;will-change:transform,opacity;transition:transform .4s ease-out,opacity .4s ease-out}
.card .no{font-size:11px;letter-spacing:.28em;opacity:.6;display:block;margin-bottom:6px}
.card .zh{font-size:20px;font-weight:800;line-height:1.15;margin-bottom:3px}
.card .en{font-size:11px;opacity:.55;letter-spacing:.06em;text-transform:uppercase}
.card .bar{position:absolute;bottom:0;left:0;right:0;height:4px;opacity:.85}

// 把 80 厅分成 4 行,每行内部错开,行方向/速度不同
const ROWS=4;
const rows=Array.from({length:ROWS},()=>[]);
ISMS.forEach((m,i)=>rows[i%ROWS].push(m));

const belt=document.getElementById('belt');
rows.forEach((items,ri)=>{
  const row=document.createElement('div');
  const baseDuration=60+ri*14;
  row.className='row'+(ri%2?' rev':'');
  row.style.setProperty('--track-duration',`${baseDuration}s`);
  row.style.setProperty('--slow-duration',`${baseDuration*2}s`);
  row.style.setProperty('--row-from',ri%2?'100%':'-100%');
  row.style.setProperty('--row-delay',`${ri*150}ms`);
  row.style.setProperty('--card-tilt',ri%2?'-2deg':'2deg');
  // 两条 track 首尾相接形成无缝循环
  for(let t=0;t<2;t++){
    const track=document.createElement('div');
    track.className='track';
    items.forEach(([slug,no,zh,en])=>{
      const a=document.createElement('a');
      a.className='card c-'+slug;
      a.href='halls/'+slug+'.html';
      a.innerHTML=`<span class="no">HALL ${no}</span><div class="zh">${zh}</div><div class="en">${en}</div><span class="bar"></span>`;
      track.appendChild(a);
    });
    row.appendChild(track);
  }
  belt.appendChild(row);
  // 用门牌底部强调色作为悬停发光色,渐变底色则退回文字色。
  row.querySelectorAll('.card').forEach(card=>{
    const barColor=getComputedStyle(card.querySelector('.bar')).backgroundColor;
    const cardColor=getComputedStyle(card).color;
    card.style.setProperty('--card-accent',barColor&&barColor!=='rgba(0, 0, 0, 0)'?barColor:cardColor);
  });
});

/* 卡片悬停粒子：CSS transition 驱动,事件委托避免 160 组监听器 */
const cardBurstAt=new WeakMap();
const burstCardParticles=card=>{
  const now=performance.now(),last=cardBurstAt.get(card)||-Infinity;
  if(now-last<250)return;
  cardBurstAt.set(card,now);
  const style=getComputedStyle(card);
  const color=style.getPropertyValue('--card-accent')||style.color;
  const count=5+Math.floor(Math.random()*4);
  for(let i=0;i<count;i++){
    const particle=document.createElement('span');
    const angle=Math.random()*Math.PI*2,distance=24+Math.random()*28;
    const x=Math.cos(angle)*distance,y=Math.sin(angle)*distance;
    particle.className='card-particle';
    particle.style.setProperty('--particle-color',color);
    particle.style.setProperty('--particle-size',`${(2+Math.random()*2).toFixed(1)}px`);
    particle.style.setProperty('--particle-radius',Math.random()>.45?'50%':'2px');
    particle.style.transition='transform .4s ease-out,opacity .4s ease-out';
    card.appendChild(particle);
    requestAnimationFrame(()=>{
      particle.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(.7) rotate(${Math.round(Math.random()*260-130)}deg)`;
      particle.style.opacity='0';
    });
    setTimeout(()=>particle.remove(),420);
  }
};

/* 自定义光标(仅桌面指针) */
(function(){
  if(!matchMedia('(pointer:fine)').matches)return;
  var dot=document.createElement('div'); dot.id='cur-dot';
  var ring=document.createElement('div'); ring.id='cur-ring';
  document.body.appendChild(dot); document.body.appendChild(ring);
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,lx=mx,ly=my,frame=0;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  var hoverSelector='a,button,.xob,.door,.card',hovered=null;
  function schedule(){
    if(!frame)frame=requestAnimationFrame(tick);
  }
  function tick(){
    frame=0;
    var dx=mx-rx,dy=my-ry;
    rx+=dx*.16;ry+=dy*.16;
    ring.style.left=rx+'px';ring.style.top=ry+'px';
    if(Math.abs(dx)>.1||Math.abs(dy)>.1)schedule();
  }
  addEventListener('mousemove',function(e){
    mx=e.clientX;my=e.clientY;
    dot.style.left=mx+'px';dot.style.top=my+'px';
    var dx=mx-lx,dy=my-ly;
    if(dx*dx+dy*dy>200){spawnP(mx,my);lx=mx;ly=my}
    schedule();
  },{passive:true});
  addEventListener('mousedown',function(){document.body.classList.add('cur-down')});
  addEventListener('mouseup',function(){document.body.classList.remove('cur-down')});
  function closestHover(node){
    return node instanceof Element?node.closest(hoverSelector):null;
  }
  document.addEventListener('mouseover',function(e){
    var target=closestHover(e.target),related=e.relatedTarget;
    if(target){
      hovered=target;
      document.body.classList.add('cur-hover');
    }
    var card=target&&target.closest('.card');
    if(card&&(!related||!(related instanceof Node)||!card.contains(related))){
      burstCardParticles(card);
    }
  },{passive:true});
  document.addEventListener('mouseout',function(e){
    var target=closestHover(e.target),related=e.relatedTarget;
    if(target&&target===hovered&&(!related||!(related instanceof Node)||!target.contains(related))){
      hovered=null;
      document.body.classList.remove('cur-hover');
    }
  },{passive:true});
  function spawnP(x,y){
    var p=document.createElement('span');p.className='cur-p';
    var sz=3+Math.random()*4,angle=Math.random()*Math.PI*2,d=16+Math.random()*32;
    var dx=Math.cos(angle)*d,dy=Math.sin(angle)*d;
    p.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;background:'+(Math.random()<.5?'#FFD23F':'#fff')+';transform:translate(-50%,-50%);transition:transform .4s ease-out,opacity .4s ease-out';
    document.body.appendChild(p);
    requestAnimationFrame(function(){
      p.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(0)';
      p.style.opacity='0';
    });
    setTimeout(function(){p.remove()},420);
  }
})();
