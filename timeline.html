// 按年份排序
ISMS.sort(function(a,b){return a[4]-b[4]});

// 渲染:十年标记 + 卡片
const tl=document.getElementById('tl');
let lastDecade=-1;
ISMS.forEach(function(m){
  var decade=Math.floor(m[4]/10)*10;
  if(decade!==lastDecade){
    lastDecade=decade;
    var d=document.createElement('div');d.className='tl-decade rv';
    d.innerHTML='<span>'+decade+'s</span>';
    tl.appendChild(d);
  }
  var a=document.createElement('a');
  a.className='tl-item rv c-'+m[0];
  a.href='halls/'+m[0]+'.html';
  a.innerHTML='<span class="tl-year">'+m[4]+'</span><div class="tl-card"><span class="no">HALL '+m[1]+'</span><div class="zh">'+m[2]+'</div><div class="en">'+m[3]+'</div><div class="man">'+m[5]+'</div><span class="bar"></span></div>';
  tl.appendChild(a);
});

/* 滚动入场 */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08});
document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});

/* 保底:IO 不可靠的环境——滚动与超时双保险 */
(function(){
  var check=function(){
    document.querySelectorAll('.rv:not(.in)').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top<innerHeight*.92&&r.bottom>0){el.classList.add('in');io.unobserve(el)}
    });
  };
  addEventListener('scroll',check,{passive:true});
  addEventListener('resize',check,{passive:true});
  setInterval(check,600);
  setTimeout(check,100);
  setTimeout(function(){document.querySelectorAll('.rv:not(.in)').forEach(function(el){el.classList.add('in')})},3000);
})();

/* 自定义光标(仅桌面指针) */
(function(){
  if(!matchMedia('(pointer:fine)').matches)return;
  var dot=document.createElement('div'); dot.id='cur-dot';
  var ring=document.createElement('div'); ring.id='cur-ring';
  document.body.appendChild(dot); document.body.appendChild(ring);
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;
    dot.style.left=mx+'px';dot.style.top=my+'px'},{passive:true});
  (function loop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;
    ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop)})();
  addEventListener('mousedown',function(e){document.body.classList.add('cur-down');rip(e.clientX,e.clientY)});
  addEventListener('mouseup',function(){document.body.classList.remove('cur-down')});
  function rip(x,y){var r=document.createElement('span');r.className='cur-ripple';
    r.style.cssText='left:'+x+'px;top:'+y+'px;transform:translate(-50%,-50%)';
    document.body.appendChild(r);setTimeout(function(){r.remove()},500)}
  document.addEventListener('mouseover',function(e){
    if(e.target.closest('a,.tl-item')) document.body.classList.add('cur-hover');
  },{passive:true});
  document.addEventListener('mouseout',function(e){
    if(e.target.closest('a,.tl-item')) document.body.classList.remove('cur-hover');
  },{passive:true});
})();
</script>
